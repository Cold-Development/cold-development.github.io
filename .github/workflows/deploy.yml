name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  # Lets you redeploy by hand from the Actions tab. There is deliberately no
  # schedule trigger: GitHub disables scheduled workflows after 60 days
  # without repo activity, and that switched off the push deploy as well.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get short commit hash
      run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Stamp commit hash and bust asset caches
      env:
        REPO_URL: https://github.com/Cold-Development/cold-development.github.io
      run: |
        for file in *.html; do
          # Footer commit link
          sed -i "s|@loading...|@<a href='${REPO_URL}/commit/${{ github.sha }}' target='_blank'>${COMMIT_HASH}</a>|g" "$file"
          # Every deploy gets fresh CSS/JS URLs, so browsers never keep an old copy
          sed -i -E "s/\?v=[^\"']*([\"'])/?v=${COMMIT_HASH}\1/g" "$file"
        done
        grep -n "?v=\|commit-hash" *.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.WEBSITE_AUTH }}
        publish_branch: gh-pages
        publish_dir: .
        exclude_assets: .github,CLAUDE.md
        enable_jekyll: false
